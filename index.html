<!doctype html>
<html lang="uz-Latn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topildi — hujjatlar</title>
<style>
:root { color-scheme: light dark; --fg: #172033; --muted: #556070; --bg: #f4f6fa; --card: #fff; --line: #dce2ec; --link: #2b5fd9 }
@media (prefers-color-scheme: dark) {
  :root { --fg: #f2f4f8; --muted: #8e95a3; --bg: #000; --card: #111214; --line: #26282d; --link: #4d7fff }
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100% }
header, main, footer { max-width: 42rem; margin: 0 auto; padding: 0 20px }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding-top: 24px; padding-bottom: 16px }
.brand { font-weight: 700; font-size: 18px; color: var(--fg); text-decoration: none }
nav { font-size: 14px; color: var(--muted) }
main { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px 28px }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px }
h2 { font-size: 18px; line-height: 1.35; margin: 28px 0 8px }
p { margin: 0 0 12px }
.updated, .intro { color: var(--muted) }
.updated { font-size: 14px; margin-bottom: 18px }
ul { margin: 0 0 12px; padding-left: 22px }
li { margin: 0 0 6px }
a { color: var(--link) }
footer { padding-top: 20px; padding-bottom: 40px; font-size: 14px }
</style>
<header><span class="brand">Topildi</span></header>
<main>
  <h1>Hujjatlar</h1>
  <ul>
    <li><a href="/privacy/">Maxfiylik siyosati</a></li>
    <li><a href="/terms/">Foydalanish shartlari</a></li>
  </ul>
  <p class="intro">Aloqa: <a href="https://t.me/dimamamann">@dimamamann</a></p>
</main>
</html>
